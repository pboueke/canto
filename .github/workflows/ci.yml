name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  setup:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create credential stub
        run: |
          cat > google-credentials.ts <<'EOF'
          export const GOOGLE_CREDENTIALS = {
            webClientId: 'stub',
            androidClientId: 'stub',
            iosClientId: 'stub',
          };
          EOF

      - name: Cache node_modules and stubs
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            google-credentials.ts
          key: deps-${{ github.sha }}

  lint:
    name: Lint & Format
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            google-credentials.ts
          key: deps-${{ github.sha }}

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

  typecheck:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            google-credentials.ts
          key: deps-${{ github.sha }}

      - name: TypeScript
        run: npm run typecheck

  test:
    name: Tests
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            google-credentials.ts
          key: deps-${{ github.sha }}

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
